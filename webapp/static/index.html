<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trump Table</title>
<style>
  :root {
    --felt: #1d6b46; --felt-dark: #124a2f; --ink: #1c1c1c; --card: #fdfcf8;
    --red: #c62828; --gold: #f4c542; --panel: #14181d; --panel-2: #1d232b; --text: #e8ecef; --muted: #8b96a1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--panel); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 300px; min-height: 100vh; }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; } }

  .table { background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
           display: grid; grid-template-rows: auto 1fr auto; padding: 12px 16px; gap: 8px; min-height: 100vh; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  #menubtn { display: none; font-size: 20px; line-height: 1; padding: 6px 12px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls label { background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .controls input { vertical-align: middle; width: 110px; }
  .controls select { font: inherit; background: #1b2b24; color: var(--text); border: 0; border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
  .seat .shown { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 6px; }
  .seat .shown .card { width: 26px; height: 38px; font-size: 11px; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .seat .shown .card small { font-size: 11px; }
  .trump { background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 999px; }
  .trump b { font-size: 20px; vertical-align: middle; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--gold); color: #222; font-weight: 600; }
  button.ghost { background: rgba(255,255,255,.15); color: var(--text); }
  button:disabled { opacity: .35; cursor: not-allowed; }

  .arena { display: grid; grid-template: "n n n" auto "w c e" 1fr / 150px 1fr 150px; gap: 8px; align-items: center; }
  .seat { background: rgba(0,0,0,.3); border-radius: 12px; padding: 10px; text-align: center; border: 2px solid transparent; }
  .seat.turn { border-color: var(--gold); box-shadow: 0 0 14px rgba(244,197,66,.5); }
  .seat h3 { margin: 0 0 4px; font-size: 15px; }
  .seat .meta { font-size: 13px; color: #cfe3d8; }
  .seat.n { grid-area: n; justify-self: center; min-width: 220px; }
  .seat.w { grid-area: w; } .seat.e { grid-area: e; }
  .boxes { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 6px; min-height: 18px; direction: ltr; }
  .boxes i { min-width: 14px; height: 18px; padding: 0 1px; box-sizing: border-box; border: 2px dotted #ff6b6b; border-radius: 3px; font: 700 11px/14px system-ui, sans-serif; font-style: normal;
             color: var(--text); text-align: center; }
  .boxes i.won { background: #ff6b6b; border-style: solid; }
  .boxes i.made { background: #2e9e5b; border: 2px solid #2e9e5b; }
  .badge { display: inline-block; background: var(--gold); color: #222; border-radius: 6px; padding: 0 6px; font-weight: 700; font-size: 12px; margin-left: 4px; }
  .backs { display: flex; justify-content: center; margin-top: 6px; min-height: 30px; }
  .backs i { width: 16px; height: 26px; margin-left: -8px; border-radius: 3px; background: repeating-linear-gradient(45deg,#2b4fa8,#2b4fa8 3px,#1e3a80 3px,#1e3a80 6px); border: 1px solid #fff8; }

  .center { grid-area: c; position: relative; min-height: 240px; }
  .center .slot { position: absolute; transform: translate(-50%,-50%); }
  .slot.s0 { left: 50%; top: 82%; } .slot.s3 { left: 22%; top: 50%; } .slot.s2 { left: 50%; top: 18%; } .slot.s1 { left: 78%; top: 50%; }
  .slot.win .card { outline: 3px solid var(--gold); }
  .status { text-align: center; min-height: 26px; font-size: 16px; }

  .card { width: 58px; height: 84px; background: var(--card); color: var(--ink); border-radius: 7px; display: inline-flex; flex-direction: column;
          align-items: center; justify-content: center; font-weight: 700; font-size: 20px; line-height: 1.05; box-shadow: 0 2px 5px rgba(0,0,0,.45); user-select: none; }
  .card.red { color: var(--red); }
  .card small { font-size: 22px; }
  .card.trump { box-shadow: 0 0 0 2px var(--gold), 0 2px 5px rgba(0,0,0,.45); }
  .hand { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 14px; padding: 6px; min-height: 100px; }
  .hand .suitgroup { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }   /* a suit is never split over two lines */
  .hand .card { width: 62px; height: 90px; transition: transform .1s; }
  .hand .card.legal { cursor: pointer; }
  .hand .card.legal:hover { transform: translateY(-12px); }
  .hand .card.dim { opacity: .45; }

  .bid-panel { background: rgba(0,0,0,.4); border-radius: 12px; padding: 10px; text-align: center; }
  .bid-panel .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 6px; }
  .bid-panel button { min-width: 42px; }

  aside { background: var(--panel-2); padding: 14px; overflow-y: auto; max-height: 100vh; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 3px 4px; text-align: right; } th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  #scores th, #scores td { text-align: center !important; }
  #scores td { border-top: 1px solid rgba(255,255,255,.08); }
  #scores th.team-us { color: #7fd6a0; } #scores th.team-them { color: #ff9a8b; }
  tr.team-us td:first-child { color: #7fd6a0; } tr.team-them td:first-child { color: #ff9a8b; }
  #log { font-size: 13px; color: #c5ced6; max-height: 320px; overflow-y: auto; }
  #log div { padding: 1px 0; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .modal.show { display: flex; }
  .modal .box { background: var(--panel-2); border-radius: 14px; padding: 18px; max-width: 760px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .modal h2 { margin-top: 0; }
  .reveal { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 10px; }
  .reveal .card { width: 34px; height: 48px; font-size: 13px; }
  .reveal .card small { font-size: 13px; }
  .good { color: #7fd6a0; } .bad { color: #ff9a8b; }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #b71c1c; color: #fff; padding: 8px 14px; border-radius: 8px; display: none; z-index: 9; }
  html[dir=rtl] th, html[dir=rtl] td { text-align: left; } html[dir=rtl] th:first-child, html[dir=rtl] td:first-child { text-align: right; }
  html[dir=rtl] .controls select { margin-left: 0; margin-right: 4px; }
  html[dir=rtl] .badge { margin-left: 0; margin-right: 4px; }
  html[dir=rtl] .hand, html[dir=rtl] .reveal, html[dir=rtl] .seat .shown { direction: ltr; }   /* cards keep their order */
  /* The table is a physical layout (West on your left, East on your right, trick cards placed by left/top):
     keep it left-to-right in Arabic too, and only restore RTL for the text inside the seats. */
  html[dir=rtl] .arena { direction: ltr; }
  html[dir=rtl] .seat { direction: rtl; }
  html[dir=rtl] body { font-family: "Segoe UI", Tahoma, system-ui, sans-serif; }
  /* phone layout: last, so it overrides the desktop sizes above */
  @media (max-width: 700px) {
    .topbar { position: relative; flex-wrap: nowrap; }
    #roundlbl { display: none; }                       /* only the Trump suit stays visible */
    #menubtn { display: block; }
    .controls { display: none; position: absolute; top: 100%; right: 0; z-index: 4; margin-top: 6px; min-width: 230px;
                flex-direction: column; align-items: stretch; background: var(--panel-2); border-radius: 12px; padding: 10px;
                box-shadow: 0 6px 20px rgba(0,0,0,.5); }
    .topbar.open .controls { display: flex; }
    .controls label { border-radius: 8px; }
    .controls input { width: 100%; margin-top: 4px; }
    .controls select { margin: 0 0 0 6px; }
    .controls button { padding: 10px 14px; }
    html[dir=rtl] .controls { right: auto; left: 0; }

    /* more room for the table: no log, no rules text, score sheet reduced to its titles and last two lines */
    #log, #logh, #rules { display: none; }
    #scores tr:not(:first-child):not(:last-child):not(:nth-last-child(2)) { display: none; }
    aside { padding: 8px 14px; max-height: none; }
    aside h2 { margin: 4px 0; }
    .table { padding: 8px 8px; gap: 6px; min-height: 0; }
    .status { font-size: 13px; min-height: 18px; }
    .arena { grid-template-columns: 84px 1fr 84px; gap: 4px; }
    .seat { padding: 6px 4px; }
    .seat h3 { font-size: 13px; }
    .seat.n { min-width: 150px; }
    .card { width: 40px; height: 58px; font-size: 14px; border-radius: 5px; }
    .card small { font-size: 15px; }
    .hand { gap: 3px 8px; padding: 2px; min-height: 66px; }
    .hand .suitgroup { gap: 2px; }
    .hand .card { width: 42px; height: 62px; }
    .seat .shown .card { width: 20px; height: 29px; font-size: 9px; }
    .seat .shown .card small { font-size: 9px; }
    .center { min-height: 170px; }
    .bid-panel { padding: 6px; font-size: 13px; }
    .bid-panel button { min-width: 34px; padding: 6px 8px; }
    .backs i { width: 10px; height: 18px; margin-left: -5px; }
    .reveal .card { width: 26px; height: 38px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <main class="table">
    <div class="topbar">
      <div><span class="trump"><span data-i18n="trump">Trump</span>: <b id="trump">–</b></span> <span id="roundlbl" style="margin-left:10px"></span></div>
      <button class="ghost" id="menubtn" aria-label="Menu">☰</button>
      <div class="controls">
        <label data-i18n-title="randTitle" title="0 = AI always plays its best move, 1 = AI plays completely at random"><span data-i18n="rand">AI randomness</span>
          <input type="range" id="rand" min="0" max="1" step="0.05" value="0"> <b id="randval">0.00</b></label>
        <label id="modellbl" data-i18n-title="modelTitle" title="Which trained networks the three AI players use. Changing it starts a new game." hidden><span data-i18n="model">AI model</span>
          <select id="model"></select></label>
        <button class="ghost" id="langbtn" title="English / العربية">العربية</button>
        <button class="ghost" id="reveal">Reveal hands</button>
        <button class="ghost" id="statsbtn" data-i18n="stats">Stats</button>
        <button class="ghost" id="newgame" data-i18n="newGame">New game</button>
      </div>
    </div>
    <div>
      <div class="arena">
        <div class="seat n" id="seat2"></div>
        <div class="seat w" id="seat3"></div>
        <div class="center" id="center"></div>
        <div class="seat e" id="seat1"></div>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div>
      <div class="bid-panel" id="bidpanel" hidden></div>
      <div class="seat turn-wrap" id="seat0" style="margin:6px auto;max-width:360px"></div>
      <div class="hand" id="hand"></div>
    </div>
  </main>
  <aside>
    <h2 data-i18n="scoresH">Scores (41 to win)</h2>
    <table id="scores"></table>
    <p style="color:var(--muted);font-size:12px" id="rules"></p>
    <h2 data-i18n="logH" id="logh">Log</h2>
    <div id="log"></div>
  </aside>
</div>

<div class="modal" id="statsmodal"><div class="box" id="statsbox"></div></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div id="toast"></div>

<script>
const SYM = { clubs: '♣', diamonds: '♦', spades: '♠', hearts: '♥' };
const RED = new Set(['diamonds', 'hearts']);
let state = null, lastVersion = -1;

const $ = id => document.getElementById(id);

// ---------- Translations (English is the default; Arabic is right-to-left) ----------
const I18N = {
  en: {
    trump: 'Trump', rand: 'AI randomness', model: 'AI model', stats: 'Stats', newGame: 'New game',
    randTitle: '0 = AI always plays its best move, 1 = AI plays completely at random',
    modelTitle: 'Which trained networks the three AI players use. Changing it starts a new game.',
    finalScores: 'Final scores',
    busy: 'The table is full right now — try again in a few minutes.',
    reveal: 'Reveal hands', hide: 'Hide hands', scoresH: 'Scores (41 to win)', logH: 'Log',
    rules: 'Teams: <span class="good">You + Anas</span> vs <span class="bad">Jamal + Bilal</span>. A player scores their bid if they take at least that many tricks, otherwise loses it (bids 7-12 count double, 13 triple).',
    seats: ['You', 'Bilal', 'Anas', 'Jamal'], suits: { clubs: 'clubs', diamonds: 'diamonds', spades: 'spades', hearts: 'hearts' },
    round: n => `Round ${n}`, bidWord: 'bid', noBid: 'no bid', tricksWord: 'tricks', scoreWord: 'score',
    yourBid: 'Your bid', yourBidQ: 'how many tricks will you take?',
    stBid: 'Your turn to bid', stFollow: 'Your turn — follow suit if you can', stLead: 'Your lead',
    stBidding: n => `${n} is bidding…`, stBidDone: 'Bidding complete', stWins: n => `${n} wins the trick`, stThinking: n => `${n} is thinking…`,
    thBid: 'Bid', thWon: 'Won', thScore: 'Score',
    win: '🏆 You and your partner win!', lose: 'Game over — the opponents win', roundDone: 'Round complete',
    roundSummary: (a, b) => `This round: you + partner <b class="${a.c}">${a.t}</b>, opponents <b class="${b.c}">${b.t}</b>. Hands as dealt are shown below.`,
    nextRound: 'Next round',
    confirmModel: m => `Switch the AI to model ${m}? This abandons the current game and starts a new one.`,
    confirmNew: 'Abandon this game and start a new one?', confirmReset: 'Erase all statistics?',
    statsTitle: m => `Statistics — AI model ${m}`,
    statsNames: ['You', 'Anas', 'Bilal', 'Jamal'],
    statsLine: (w, g, r, a, b) => `Games won by you + partner: <b>${w} / ${g}</b> (${g ? Math.round(100 * w / g) : '–'}%) · Rounds played: <b>${r}</b><br>Total round points: you + partner <b>${a}</b>, opponents <b>${b}</b>`,
    statsHead: ['Avg bid', 'Avg tricks', 'Bid made', 'Overbid', 'Underbid', 'Pts/round'],
    statsNote: 'Overbid = failed the bid; Underbid = won more tricks than bid. Stats accumulate across games (all AI-randomness settings mixed together), separately for each AI model, and are saved in webapp/stats.json (v1) or webapp/stats_&lt;model&gt;.json. Only completed rounds count.',
    resetStats: 'Reset stats', close: 'Close',
  },
  ar: {
    trump: 'الطرنيب', rand: 'عشوائية الذكاء الاصطناعي', model: 'نموذج الذكاء الاصطناعي', stats: 'الإحصائيات', newGame: 'لعبة جديدة',
    randTitle: '0 = يلعب الذكاء الاصطناعي دائمًا أفضل حركة، 1 = يلعب عشوائيًا تمامًا',
    modelTitle: 'الشبكات العصبية المدرَّبة التي يستخدمها اللاعبون الثلاثة. تغييرها يبدأ لعبة جديدة.',
    finalScores: 'النتائج النهائية',
    busy: 'الطاولة ممتلئة حاليًا — حاول مجددًا بعد دقائق.',
    reveal: 'اكشف الأوراق', hide: 'أخفِ الأوراق', scoresH: 'النقاط (41 للفوز)', logH: 'السجل',
    rules: 'الفريقان: <span class="good">أنت + أنس</span> ضد <span class="bad">جمال + بلال</span>. يحصل اللاعب على نقاط مزايدته إذا أخذ عددًا من الأكلات يساويها أو يزيد عليها، وإلا خسرها (المزايدات 7-12 تُحتسب بالضعف، و13 بثلاثة أضعاف).',
    seats: ['أنت', 'بلال', 'أنس', 'جمال'], suits: { clubs: 'سباتي', diamonds: 'ديناري', spades: 'بستوني', hearts: 'كوبّة' },
    round: n => `الجولة ${n}`, bidWord: 'ضمان', noBid: 'بلا ضمان', tricksWord: 'لطوش', scoreWord: 'النقاط',
    yourBid: 'ضمانك', yourBidQ: 'كم لطش ستأخذ؟',
    stBid: 'دورك في الضمان', stFollow: 'دورك — العب من نفس النوع إن أمكن', stLead: 'دورك في البدء',
    stBidding: n => `${n} يضمن…`, stBidDone: 'انتهى الضمان', stWins: n => `${n} يربح اللطش`, stThinking: n => `${n} يفكّر…`,
    thBid: 'الضمان', thWon: 'اللطوش', thScore: 'النقاط',
    win: '🏆 أنت وشريكك فزتما!', lose: 'انتهت اللعبة — فاز الخصوم', roundDone: 'انتهت الجولة',
    roundSummary: (a, b) => `هذه الجولة: أنت + شريكك <b class="${a.c}" dir="ltr">${a.t}</b>، الخصوم <b class="${b.c}" dir="ltr">${b.t}</b>. الأوراق كما وُزِّعت معروضة أدناه.`,
    nextRound: 'الجولة التالية',
    confirmModel: m => `تغيير النموذج إلى ${m}؟ سيتم التخلي عن اللعبة الحالية وبدء لعبة جديدة.`,
    confirmNew: 'التخلي عن هذه اللعبة وبدء لعبة جديدة؟', confirmReset: 'مسح كل الإحصائيات؟',
    statsTitle: m => `الإحصائيات — النموذج ${m}`,
    statsNames: ['أنت', 'أنس', 'بلال', 'جمال'],
    statsLine: (w, g, r, a, b) => `الألعاب التي فزت بها مع شريكك: <b>${w} / ${g}</b> (${g ? Math.round(100 * w / g) : '–'}%) · الجولات الملعوبة: <b>${r}</b><br>مجموع نقاط الجولات: أنت + شريكك <b>${a}</b>، الخصوم <b>${b}</b>`,
    statsHead: ['متوسط الضمان', 'متوسط اللطوش', 'ضمان ناجح', 'ضمان زائد', 'ضمان ناقص', 'نقاط/جولة'],
    statsNote: 'ضمان زائد = فشل في تحقيق الضمان؛ ضمان ناقص = أخذ لطوش أكثر مما ضمن. تتراكم الإحصائيات عبر الألعاب (بكل إعدادات العشوائية معًا) ولكل نموذج على حدة، وتُحفظ في webapp/stats.json (النموذج v1) أو webapp/stats_&lt;model&gt;.json. تُحتسب الجولات المكتملة فقط.',
    resetStats: 'تصفير الإحصائيات', close: 'إغلاق',
  },
};
// Server messages (log lines, errors) are English; translate them here.
const SERVER_MSG_AR = [
  [/^(\w+) bids (\d+)$/, (m, n, b) => `${trSeat(n)} يضمن ${b}`],
  [/^Bids total (\d+) \(< (\d+)\): cards are redealt$/, (m, a, b) => `مجموع الضمانات ${a} (أقل من ${b}): تُعاد التوزيعة`],
  [/^--- Round (\d+) ---$/, (m, n) => `--- الجولة ${n} ---`],
  [/^Game over$/, () => 'انتهت اللعبة'],
  [/^(\w+): bid (\d+), won (\d+) -> ([+-]?\d+)$/, (m, n, b, w, d) => `${trSeat(n)}: اضمن ${b}، أخذ ${w} ← <span dir="ltr">${d}</span>`],
  [/^Not waiting for a (\w+) right now$/, () => 'لا يُنتظر هذا الإجراء الآن'],
  [/^The table is full$/, () => 'الطاولة ممتلئة'],
  [/^Invalid bid$/, () => 'ضمان غير صالح'],
  [/^That card cannot be played now$/, () => 'لا يمكن لعب هذه الورقة الآن'],
  [/^Model (\S+) is not available$/, (m, n) => `النموذج ${n} غير متوفر`],
  [/^Could not load the (\S+) weights.*$/, (m, n) => `تعذّر تحميل أوزان النموذج ${n} (ربما يجري حفظ تدريب)، حاول مجددًا`],
  [/^Could not switch to the (\S+) model$/, (m, n) => `تعذّر التبديل إلى النموذج ${n}`],
];
const SEAT_EN = ['You', 'East', 'Partner', 'West'];
let lang = 'en';
try { lang = localStorage.getItem('lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
const T = () => I18N[lang];
const trSeat = n => { const i = SEAT_EN.indexOf(n); return i < 0 ? n : T().seats[i]; };
const trMsg = text => {
  if (lang !== 'ar') return text;
  for (const [re, f] of SERVER_MSG_AR) { const m = text.match(re); if (m) return f(...m); }
  return text;
};
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'طاولة الأتوت' : 'Trump Table';
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = T()[e.dataset.i18n]);
  document.querySelectorAll('[data-i18n-title]').forEach(e => e.title = T()[e.dataset.i18nTitle]);
  $('rules').innerHTML = T().rules;
  $('langbtn').textContent = lang === 'ar' ? 'English' : 'العربية';
  if (state) render(state);
}
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!j.ok && j.error) toast(trMsg(j.error));
  return j;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

function cardEl(c, opts = {}) {
  const d = document.createElement('div');
  d.className = 'card' + (RED.has(c.suit) ? ' red' : '') + (state && c.suit === state.trump ? ' trump' : '');
  d.innerHTML = `<span>${c.rank}</span><small>${SYM[c.suit]}</small>`;
  return d;
}

// One small frame per trick bid (the last one carries the bid number); each trick won fills a frame.
// Once the bid is made every frame turns green (the number stays) and extra tricks add green frames.
function bidBoxes(s) {
  if (!s.bid) return '<div class="boxes"></div>';
  const made = s.tricks >= s.bid, n = Math.max(s.bid, s.tricks), t = T();
  let h = '';
  for (let k = 1; k <= n; k++) {
    const cls = made ? 'made' : k <= s.tricks ? 'won' : '';
    h += `<i class="${cls}">${k === s.bid ? s.bid : ''}</i>`;
  }
  return `<div class="boxes" title="${t.bidWord} ${s.bid} · ${t.tricksWord} ${s.tricks}">${h}</div>`;
}

function seatHtml(i, s, st) {
  const dealer = st.dealer === i ? '<span class="badge">D</span>' : '';
  return `<h3>${trSeat(s.name)}${dealer}</h3>${bidBoxes(s)}` +
         (i === 0 ? '' : st.other_hands ? `<div class="shown">${st.other_hands[i].map(c => cardEl(c).outerHTML).join('')}</div>`
                        : `<div class="backs">${'<i></i>'.repeat(s.cards)}</div>`);
}

function render(st) {
  state = st;
  $('trump').innerHTML = st.trump ? `<span style="color:${RED.has(st.trump) ? '#ff6b6b' : '#fff'}">${SYM[st.trump]}</span> ${T().suits[st.trump]}` : '–';
  $('roundlbl').textContent = st.round ? T().round(st.round) : '';

  st.seats.forEach((s, i) => {
    const el = $('seat' + i);
    el.innerHTML = seatHtml(i, s, st);
    el.classList.toggle('turn', st.turn === i);
  });

  // trick
  const center = $('center'); center.innerHTML = '';
  st.trick.forEach(t => {
    const slot = document.createElement('div');
    slot.className = `slot s${t.seat}` + (st.trick_winner === t.seat ? ' win' : '');
    slot.appendChild(cardEl(t.card));
    center.appendChild(slot);
  });

  // hand
  const hand = $('hand'); hand.innerHTML = '';
  let group = null;
  st.hand.forEach(c => {
    if (!group || group.dataset.suit !== c.suit) {   // one container per suit, so wrapping keeps each suit on one line
      group = document.createElement('div'); group.className = 'suitgroup'; group.dataset.suit = c.suit; hand.appendChild(group);
    }
    const el = cardEl(c);
    if (st.awaiting === 'card') {
      if (st.legal.includes(c.id)) { el.classList.add('legal'); el.onclick = () => api('/api/card', { value: c.id }); }
      else el.classList.add('dim');
    }
    group.appendChild(el);
  });

  // status + bid panel
  const bp = $('bidpanel');
  bp.hidden = st.awaiting !== 'bid';
  if (st.awaiting === 'bid') {
    const seatsBid = st.seats.map(s => s.bid ? `${trSeat(s.name)}: ${s.bid}` : null).filter(Boolean).join(' · ');
    let btns = '';
    for (let b = 2; b <= 13; b++) btns += `<button data-b="${b}" ${b < st.min_bid ? 'disabled' : ''}>${b}</button>`;
    bp.innerHTML = `<div><b>${T().yourBid}</b> — ${T().yourBidQ} <span style="color:#cfe3d8">${seatsBid ? '(' + seatsBid + ')' : ''}</span></div><div class="row">${btns}</div>`;
    bp.querySelectorAll('button').forEach(b => b.onclick = () => api('/api/bid', { value: +b.dataset.b }));
  }
  let status = '';
  const t = T(), nm = i => trSeat(st.seats[i].name);
  if (st.awaiting === 'bid') status = t.stBid;
  else if (st.awaiting === 'card') status = st.trick.length ? t.stFollow : t.stLead;
  else if (st.phase === 'bidding') status = st.turn !== null ? t.stBidding(nm(st.turn)) : t.stBidDone;
  else if (st.phase === 'playing') status = st.trick_winner !== null && st.trick_winner !== undefined ? t.stWins(nm(st.trick_winner)) : (st.turn !== null ? t.stThinking(nm(st.turn)) : '');
  $('status').textContent = status;

  // sidebar
  // Score sheet: one column per player (you, East, partner, West), one row per round: bid/<b>running score</b>.
  // The round in progress shows its bids with "–" until the round ends.
  const cell = (bid, score) => `<td dir="ltr">${bid || '–'}/<b>${score === null ? '–' : score}</b></td>`;
  const rows = st.history.map(h => '<tr>' + h.bids.map((b, i) => cell(b, h.scores[i])).join('') + '</tr>');
  if (st.phase !== 'round_over' && st.phase !== 'game_over' && st.seats.some(s => s.bid))
    rows.push('<tr>' + st.seats.map(s => cell(s.bid, null)).join('') + '</tr>');
  $('scores').innerHTML = '<tr>' + st.seats.map((s, i) => `<th class="team-${i % 2 ? 'them' : 'us'}">${trSeat(s.name)}</th>`).join('') + '</tr>' + rows.join('');
  const log = $('log'); const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.innerHTML = st.log.map(l => `<div>${trMsg(l)}</div>`).join('');
  if (atEnd) log.scrollTop = log.scrollHeight;

  const sel = $('model'), models = st.models.join(',');
  if (sel.dataset.models !== models) {
    sel.innerHTML = st.models.map(m => `<option value="${m}">${m}</option>`).join('');
    sel.dataset.models = models;
  }
  if (document.activeElement !== sel) sel.value = st.model;
  $('modellbl').hidden = st.models.length < 2;   // nothing to choose from

  $('reveal').textContent = st.reveal ? T().hide : T().reveal;
  if (document.activeElement !== $('rand')) { $('rand').value = st.randomness; $('randval').textContent = st.randomness.toFixed(2); }
  renderModal(st);
}

function renderModal(st) {
  const m = $('modal');
  if (!st.summary) { m.classList.remove('show'); return; }
  const s = st.summary;
  const teamUs = s.seats[0].delta + s.seats[2].delta, teamThem = s.seats[1].delta + s.seats[3].delta;
  const rows = [0, 2, 1, 3].map(i => {
    const x = s.seats[i], ok = x.tricks >= x.bid;
    return `<tr class="team-${i % 2 ? 'them' : 'us'}"><td>${trSeat(x.name)}</td><td>${x.bid}</td><td>${x.tricks}</td><td class="${ok ? 'good' : 'bad'}" dir="ltr">${x.delta > 0 ? '+' : ''}${x.delta}</td><td><b>${x.score}</b></td></tr>` +
           `<tr><td colspan="5"><div class="reveal">${x.hand.map(c => cardEl(c).outerHTML).join('')}</div></td></tr>`;
  }).join('');
  const t = T(), sg = v => (v > 0 ? '+' : '') + v;
  if (s.over) {   // end of the game: just the result and the final scores
    const head = s.seats.map((x, i) => `<th class="team-${i % 2 ? 'them' : 'us'}">${trSeat(x.name)}</th>`).join('');
    const scores = s.seats.map(x => `<td dir="ltr" style="font-size:26px;text-align:center"><b>${x.score}</b></td>`).join('');
    m.querySelector('#modalbox').innerHTML = `<h2>${s.winner === 'us' ? t.win : t.lose}</h2>
      <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">${t.finalScores}</h2>
      <table><tr>${head.replace(/<th /g, '<th style="text-align:center" ')}</tr><tr>${scores}</tr></table>
      <p style="text-align:${lang === 'ar' ? 'left' : 'right'}"><button id="next">${t.newGame}</button></p>`;
    $('next').onclick = () => api('/api/new_game');
    m.classList.add('show');
    return;
  }
  let title = s.over ? (s.winner === 'us' ? t.win : t.lose) : t.roundDone;
  m.querySelector('#modalbox').innerHTML = `<h2>${title}</h2>
    <p>${t.roundSummary({ c: teamUs >= 0 ? 'good' : 'bad', t: sg(teamUs) }, { c: teamThem >= 0 ? 'good' : 'bad', t: sg(teamThem) })}</p>
    <table><tr><th></th><th>${t.thBid}</th><th>${t.thWon}</th><th>Δ</th><th>${t.thScore}</th></tr>${rows}</table>
    <p style="text-align:${lang === 'ar' ? 'left' : 'right'}"><button id="next">${s.over ? t.newGame : t.nextRound}</button></p>`;
  $('next').onclick = () => s.over ? api('/api/new_game') : api('/api/ack');
  m.classList.add('show');
}

async function poll() {
  try {
    const st = await (await fetch('/api/state')).json();
    if (st.busy) { $('status').textContent = T().busy; lastVersion = -1; }
    else if (st.version !== lastVersion) { lastVersion = st.version; render(st); }
  } catch (e) { /* server restarting */ }
  setTimeout(poll, 300);
}
$('rand').oninput = () => { $('randval').textContent = (+$('rand').value).toFixed(2); };
$('rand').onchange = () => api('/api/settings', { randomness: +$('rand').value });
$('reveal').onclick = () => api('/api/settings', { reveal: !state.reveal });
$('model').onchange = async () => {
  const wanted = $('model').value;
  if (!confirm(T().confirmModel(wanted))) { $('model').value = state.model; return; }
  const j = await api('/api/model', { model: wanted });
  if (!j.ok) $('model').value = state.model;
};

const f1 = v => v === null ? '–' : v.toFixed(1), pct = v => v === null ? '–' : v.toFixed(0) + '%';
async function showStats() {
  const s = await (await fetch('/api/stats')).json();
  const t = T(), names = t.statsNames, idx = [0, 2, 1, 3];
  const rows = idx.map((i, k) => { const x = s.seats[i];
    return `<tr class="team-${i % 2 ? 'them' : 'us'}"><td>${names[k]}</td><td>${f1(x.avg_bid)}</td><td>${f1(x.avg_tricks)}</td><td>${pct(x.made_pct)}</td><td>${pct(x.over_pct)}</td><td>${pct(x.under_pct)}</td><td>${f1(x.avg_points)}</td></tr>`; }).join('');
  $('statsbox').innerHTML = `<h2>${t.statsTitle(s.model)}</h2>
    <p>${t.statsLine(s.games_won, s.games, s.rounds, s.team_points[0], s.team_points[1])}</p>
    <table><tr><th></th>${t.statsHead.map(h => `<th>${h}</th>`).join('')}</tr>${rows}</table>
    <p style="color:var(--muted);font-size:12px">${t.statsNote}</p>
    <p style="text-align:${lang === 'ar' ? 'left' : 'right'}"><button class="ghost" id="resetstats">${t.resetStats}</button> <button id="closestats">${t.close}</button></p>`;
  $('closestats').onclick = () => $('statsmodal').classList.remove('show');
  $('resetstats').onclick = async () => { if (confirm(T().confirmReset)) { await api('/api/reset_stats'); showStats(); } };
  $('statsmodal').classList.add('show');
}
$('statsbtn').onclick = showStats;
$('newgame').onclick = () => { if (confirm(T().confirmNew)) api('/api/new_game'); };
$('menubtn').onclick = e => { e.stopPropagation(); document.querySelector('.topbar').classList.toggle('open'); };
// close the menu after an action button, or when tapping anywhere outside it
document.querySelector('.controls').addEventListener('click', e => {
  if (e.target.closest('button')) document.querySelector('.topbar').classList.remove('open');
});
document.addEventListener('click', e => { if (!e.target.closest('.controls')) document.querySelector('.topbar').classList.remove('open'); });
$('langbtn').onclick = () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
  if ($('statsmodal').classList.contains('show')) showStats();
};
applyLang();
poll();
</script>
</body>
</html>
